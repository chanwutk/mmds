[project]
name = "mmds"
version = "0.1.0"
description = "Multi-modal Data Systems"
readme = "README.md"
authors = [
    { name = "Chanwut (Mick) Kittivorawong", email = "chanwutk@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai",
    "pydantic>=2",
    "ultralytics",
    "yt-dlp>=2026.3.3",
    "clip @ git+https://github.com/ultralytics/CLIP.git",
    # Listed directly (not only via ultralytics) so tool.uv.sources applies.
    "torch",
    "torchvision",
]

# On Linux, install CUDA 12.6 PyTorch builds: they still ship sm_61 kernels for
# the Pascal GPUs (TITAN Xp) on the shared GPU server, which newer CUDA builds
# dropped. Other platforms keep the default PyPI wheels.
[tool.uv.sources]
torch = { index = "pytorch-cu126", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cu126", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[project.scripts]
mmds = "mmds:main"

[build-system]
requires = ["uv_build>=0.10.5,<0.11.0"]
build-backend = "uv_build"
